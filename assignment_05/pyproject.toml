[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olin-dsa-assignment-05"
version = "0.1.0"
description = "Assignment 5: Strassen's algorithm and dynamic-programming sequence alignment"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["divide_and_conquer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
