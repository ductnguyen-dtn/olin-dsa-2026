[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olin-dsa-hw1"
version = "0.1.0"
description = "Assignment 1: Spot Micro servo-movement port + meeting-conflict scheduler"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["spotmicro_servo", "meeting_scheduler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

# Test functions take pytest-injected parameters (parametrize values, fixtures)
# that are tedious to annotate and add no safety; keep type-checking the bodies
# but don't demand signatures on every test.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
